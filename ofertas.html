<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Política de seguridad: solo permite recursos propios y las fuentes de Google -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; base-uri 'none'; object-src 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#A64F3C">
    <meta name="description" content="Descuentos y promociones en confección de vestidos y arreglos de prendas.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_CL">
    <meta property="og:title" content="Ofertas | Hilos & Estilos">
    <meta property="og:description" content="Descuentos y promociones en confección de vestidos y arreglos de prendas.">
    <meta property="og:image" content="assetes/imagenes/maquina.jpg">
    <meta name="robots" content="index, follow">
    <title>Ofertas | Hilos & Estilos</title>
    <link rel="icon" href="assetes/imagenes/logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="assetes/estilos/style.css">
</head>
<body>
    <a class="salto-contenido" href="#contenido">Saltar al contenido</a>
    <div id="header"></div>

    <main id="contenido">
        <section class="cabecera-pagina">
            <h1>Ofertas especiales</h1>
            <p>Aprovecha nuestras promociones en confección y arreglos.</p>
        </section>
        <section class="seccion">
            <div class="contenedor">
                <div class="ofertas">
                    <article class="producto aparecer">
                        <span class="insignia">Oferta</span>
                        <div class="producto-img"><img src="assetes/imagenes/maniqui.jpg" alt="Vestido en maniquí de costura" loading="lazy" width="600" height="450"></div>
                        <div class="producto-cuerpo">
                            <p class="oferta-destacada">20% dcto.</p>
                            <h3>Descuento 20%</h3>
                            <p>En confección de vestidos.</p>
                            <a class="btn" href="contacto.html?asunto=Cotización">Aprovechar</a>
                        </div>
                    </article>
                    <article class="producto aparecer">
                        <span class="insignia">Promoción</span>
                        <div class="producto-img"><img src="assetes/imagenes/maquina.jpg" alt="Máquina de coser lista para un arreglo" loading="lazy" width="600" height="450"></div>
                        <div class="producto-cuerpo">
                            <p class="oferta-destacada">Arreglos</p>
                            <h3>Arreglo de prendas</h3>
                            <p>Promoción con descuento en arreglos de prendas.</p>
                            <a class="btn" href="contacto.html?asunto=Arreglos">Aprovechar</a>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>
    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
